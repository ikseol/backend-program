<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>블로그 글 목록</title>
    <!-- Bootstrap CSS 라이브러리 사용 npm install 로 사용 or CDN으로 포함시키기(URL로 접근) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="p-5 mb-5 text-center bg-light">
        <h1 class="mb-3">My Blog</h1>
        <h4 class="mb-3">블로그에 오신 것을 환영합니다.</h4>
    </div>

    <div class="container">
        <div class="row-6" th:each="article : ${articles}"> <!--     이  div 태그를 articles의 길이만큼 반복       -->
            <div class="card">
                <div class="card-header"></div>
                <div class="card-body">
                    <h5 class="card-title" th:text="${article.title}"></h5>
                    <p  class="card-text" th:text="${article.content}"></p>
                    <a href="" class="btn btn-primary">보러가기</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
